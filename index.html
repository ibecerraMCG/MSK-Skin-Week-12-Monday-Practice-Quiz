<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12 Monday Practice Quiz</title>
<style>
    /* --- Color Variables --- */
    :root {
        /* Default: Dark Theme */
        --bg-color: #2d343e; /* Dark background */
        --container-bg: #3c424f; /* Slightly lighter container */
        --text-color: #e8e6e3; /* Light text */
        --question-text-color: #8ab4f8; /* Light blue for questions */
        --lo-text-color: #b0c4de; /* Lighter blue for learning objective */
        --border-color: #555; /* Darker borders */
        --separator-color: #4a4f5a;
        --label-bg: #454c5a;
        --label-border: #6c757d;
        --label-hover-bg: #525966;
        --label-hover-border: #7a828a;
        --button-bg: #8ab4f8;
        --button-text: #202124;
        --button-hover-bg: #a3c5f9;
        --button-disabled-bg: #5f6368;
        --feedback-correct-bg: #344e41;
        --feedback-correct-text: #c7f9cc;
        --feedback-correct-border: #52b788;
        --feedback-incorrect-bg: #5e2129;
        --feedback-incorrect-text: #f8d7da;
        --feedback-incorrect-border: #a4133c;
        --feedback-rationale-text: #adb5bd; /* Lighter gray for rationale */
        --feedback-source-text: #c7d3e0;
        --feedback-separator: #6c757d;
        --radio-accent: #8ab4f8;
    }

    .light-theme {
        --bg-color: #eef2f7;
        --container-bg: #ffffff;
        --text-color: #343a40;
        --question-text-color: #0056b3;
        --lo-text-color: #5a6e8a;
        --border-color: #dee2e6;
        --separator-color: #e9ecef;
        --label-bg: #f8f9fa;
        --label-border: #ced4da;
        --label-hover-bg: #e2e6ea;
        --label-hover-border: #adb5bd;
        --button-bg: #007bff;
        --button-text: white;
        --button-hover-bg: #0056b3;
        --button-disabled-bg: #6c757d;
        --feedback-correct-bg: #d1e7dd;
        --feedback-correct-text: #0f5132;
        --feedback-correct-border: #badbcc;
        --feedback-incorrect-bg: #f8d7da;
        --feedback-incorrect-text: #842029;
        --feedback-incorrect-border: #f5c2c7;
        --feedback-rationale-text: #495057;
        --feedback-source-text: #343a40;
        --feedback-separator: #ccc;
        --radio-accent: #007bff;
    }

    /* --- General Styles --- */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
        line-height: 1.7;
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-color);
        padding-bottom: 40px;
        transition: background-color 0.3s, color 0.3s;
    }

    #theme-toggle-button {
        position: fixed;
        top: 15px;
        right: 15px;
        padding: 8px 12px;
        background-color: var(--button-bg);
        color: var(--button-text);
        border: 1px solid var(--label-border);
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
        z-index: 1000;
         transition: background-color 0.3s, color 0.3s;
    }
     #theme-toggle-button:hover {
         opacity: 0.8;
     }


    #quiz-container {
        max-width: 900px;
        margin: 80px auto 30px auto;
        background: var(--container-bg);
        padding: 25px 35px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        border: 1px solid var(--border-color);
        transition: background-color 0.3s, border-color 0.3s;
    }

    .question-block {
        margin-bottom: 35px;
        padding-bottom: 25px;
        border-bottom: 1px solid var(--separator-color);
        transition: border-color 0.3s;
    }

    .question-block:last-child {
        border-bottom: none;
        margin-bottom: 0;
        padding-bottom: 5px;
    }
    
    .learning-objective {
        font-size: 0.85em;
        font-style: italic;
        color: var(--lo-text-color);
        margin-bottom: 15px;
        padding-bottom: 10px;
        border-bottom: 1px dashed var(--separator-color);
    }

    .question-text {
        font-weight: 600;
        font-size: 1.1em;
        margin-bottom: 18px;
        color: var(--question-text-color);
        transition: color 0.3s;
    }

    .options label {
        display: block;
        margin-bottom: 12px;
        cursor: pointer;
        padding: 10px 15px;
        border-radius: 6px;
        border: 1px solid var(--label-border);
        background-color: var(--label-bg);
        transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out;
    }

    .options label:hover {
        background-color: var(--label-hover-bg);
        border-color: var(--label-hover-border);
    }

    .options input[type="radio"]:checked+span {
         font-weight: bold;
         color: var(--question-text-color);
    }
    .options input[type="radio"] {
        margin-right: 12px;
        accent-color: var(--radio-accent);
    }

    .button-container {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .check-button {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.95em;
        transition: background-color 0.2s, color 0.2s, opacity 0.2s;
        background-color: var(--button-bg);
        color: var(--button-text);
    }

    .check-button:hover {
        opacity: 0.85;
    }

     .check-button:disabled {
         background-color: var(--button-disabled-bg);
         cursor: not-allowed;
         opacity: 0.7;
     }

    .feedback {
        margin-top: 20px;
        padding: 15px;
        border-radius: 6px;
        font-size: 0.95em;
        display: none;
        border: 1px solid transparent;
        transition: background-color 0.3s, color 0.3s, border-color 0.3s;
    }

    .feedback.correct {
        background-color: var(--feedback-correct-bg);
        color: var(--feedback-correct-text);
        border-color: var(--feedback-correct-border);
        display: block;
    }

    .feedback.incorrect {
        background-color: var(--feedback-incorrect-bg);
        color: var(--feedback-incorrect-text);
        border-color: var(--feedback-incorrect-border);
        display: block;
    }

    .feedback-status {
         font-weight: bold;
         font-size: 1.1em;
         display: block;
         margin-bottom: 8px;
    }

    .feedback-rationale {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px dashed var(--feedback-separator);
        font-size: 0.9em;
        color: var(--feedback-rationale-text);
        transition: color 0.3s, border-color 0.3s;
    }
    
    .feedback-source {
        margin-top: 10px;
        font-size: 0.85em;
        font-style: italic;
        color: var(--feedback-source-text);
        background-color: rgba(0,0,0,0.1);
        padding: 8px;
        border-radius: 4px;
    }

    h1 {
        text-align: center;
        color: var(--question-text-color);
        margin-top: 30px;
        margin-bottom: 30px;
        font-weight: 600;
        transition: color 0.3s;
    }

</style>
</head>
<body>

    <button id="theme-toggle-button">Toggle Theme</button>
    <h1>Week 12 Monday Practice Quiz</h1>

    <div id="quiz-container">
        <!-- Questions will be loaded here by JavaScript -->
    </div>

<script>
    const quizData = [
        // Introduction to the Musculoskeletal System
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 1: Demonstrate & describe the anatomical position, as well as anatomical directions, planes, & movements.",
            question: "A radiologist is reviewing a series of images that show the body divided into anterior and posterior portions. Which anatomical plane do these images represent?",
            options: { A: "Sagittal plane", B: "Median plane", C: "Axial plane", D: "Frontal (coronal) plane" },
            correctAnswer: "D",
            rationale: "The frontal or coronal plane is a vertical plane that runs perpendicular to the median plane, dividing the body into anterior (front) and posterior (back) parts.",
            source: "'Coronal or Frontal Plane (vertical plane perpendicular to median plane)' (Introduction to the Musculoskeletal System, Slide 4)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 1: Demonstrate & describe the anatomical position, as well as anatomical directions, planes, & movements.",
            question: "During a physical therapy session, a patient is instructed to perform an exercise that involves moving their arm away from the midline of their body. Which term best describes this movement?",
            options: { A: "Adduction", B: "Abduction", C: "Flexion", D: "Extension" },
            correctAnswer: "B",
            rationale: "Abduction is the term for moving a body part away from the midline. Adduction is the opposite movement, bringing a body part towards the midline. Flexion and extension refer to decreasing or increasing the angle between body parts.",
            source: "'Abduction vs. Adduction, moving away from midline, moving towards from midline' (Introduction to the Musculoskeletal System, Slide 7)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 2: Identify the major components of the skeletal system and describe their functions. Distinguish between the axial & appendicular skeletal systems.",
            question: "A patient sustains multiple fractures in a motor vehicle accident. The physician notes that the injuries are confined to the bones of the head, neck, and trunk. Which division of the skeletal system has been primarily affected?",
            options: { A: "Appendicular skeleton", B: "Axial skeleton", C: "Synovial skeleton", D: "Cartilaginous skeleton" },
            correctAnswer: "B",
            rationale: "The axial skeleton is composed of the bones of the head, neck, and trunk. The appendicular skeleton consists of the bones of the limbs, including the pectoral and pelvic girdles.",
            source: "'Axial skeleton: Bones of the head, neck, & trunk' (Introduction to the Musculoskeletal System, Slide 13)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 2: Identify the major components of the skeletal system and describe their functions. Distinguish between the axial & appendicular skeletal systems.",
            question: "A forensic anthropologist is examining a set of skeletal remains. The analysis includes the clavicle, scapula, and bones of the upper and lower limbs. These bones are all part of which major skeletal division?",
            options: { A: "Axial skeleton", B: "Appendicular skeleton", C: "Vertebral skeleton", D: "Central skeleton" },
            correctAnswer: "B",
            rationale: "The appendicular skeleton includes the bones of the limbs, which encompasses the pectoral girdle (clavicle and scapula) and the pelvic girdle, as well as the arm, forearm, hand, thigh, leg, and foot bones.",
            source: "'Appendicular skeleton: Bones of the limbs (including pectoral & pelvic girdles)' (Introduction to the Musculoskeletal System, Slide 13)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 3: Identify and describe the different types of joints and explain their functions.",
            question: "A 25-year-old baseball pitcher presents with shoulder pain. An MRI reveals inflammation within the joint, which is characterized by a fluid-filled cavity, an articular capsule, and articular cartilage. This description is characteristic of which type of joint?",
            options: { A: "Fibrous joint", B: "Synovial joint", C: "Cartilaginous joint", D: "Suture joint" },
            correctAnswer: "B",
            rationale: "Synovial joints are characterized by a synovial fluid-filled joint cavity, an articular capsule, a synovial membrane, and articular cartilage. These features distinguish them from fibrous and cartilaginous joints.",
            source: "'Elements ALWAYS associated with diarthrodial (synovial) joints. • Synovial fluid • Articular cartilage • Articular capsule • Synovial membrane' (Introduction to the Musculoskeletal System, Slide 17)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 3: Identify and describe the different types of joints and explain their functions.",
            question: "A gymnast is demonstrating extreme flexibility by performing a series of movements at the hip, including flexion, extension, abduction, adduction, and rotation. The hip joint allows for this wide range of motion because it is what type of synovial joint?",
            options: { A: "Hinge joint", B: "Pivot joint", C: "Plane joint", D: "Ball and socket joint" },
            correctAnswer: "D",
            rationale: "Ball and socket joints are multiaxial, allowing for movement in several planes. A rounded head of one bone fits into a concavity on another, permitting flexion, extension, abduction, adduction, and rotation. The hip and shoulder are primary examples.",
            source: "'Ball and socket In ball and socket joints (multiaxial), a rounded head fits into a concavity, permitting movement on several axes.' (Introduction to the Musculoskeletal System, Slide 17)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 4: Identify the major components of the muscular system, with an emphasis on skeletal muscle, and describe their functions.",
            question: "A patient is recovering from a prolonged period of bed rest and is noted to have significant muscle weakness. The physical therapist explains that the primary function of skeletal muscle tissue is to produce a specific physical quantity. What is this quantity?",
            options: { A: "Electrical charge", B: "Heat", C: "Tension", D: "Momentum" },
            correctAnswer: "C",
            rationale: "The primary function of muscle tissue is to produce tension, which translates into force. While muscles do produce heat as a byproduct, and are activated by electrical charges, their fundamental mechanical output is tension.",
            source: "'Ultimately, muscle tissue does primarily one thing: it produces tension → a force' (Introduction to the Musculoskeletal System, Slide 20)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 4: Identify the major components of the muscular system, with an emphasis on skeletal muscle, and describe their functions.",
            question: "A student is learning about the properties of muscle tissue. They observe that when a muscle is stimulated, it has the ability to shorten. Which characteristic of muscle tissue does this describe?",
            options: { A: "Irritability", B: "Extensibility", C: "Elasticity", D: "Contractility" },
            correctAnswer: "D",
            rationale: "Contractility is the unique ability of a muscle to shorten when it receives sufficient stimulation. Irritability is the ability to respond to stimulation, extensibility is the ability to lengthen, and elasticity is the ability to return to resting length.",
            source: "'Contractility • Ability of a muscle to shorten when it receives sufficient stimulation' (Introduction to the Musculoskeletal System, Slide 21)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 5: Differentiate between different types of muscle contractions. Determine the role that a muscle or group of muscles serve during movement (agonist, antagonist, or synergist).",
            question: "A weightlifter is holding a barbell in a stationary position, with the elbow flexed at 90 degrees. Although the biceps brachii is activated, no movement is occurring at the elbow joint. What type of muscle contraction is the biceps performing?",
            options: { A: "Concentric", B: "Eccentric", C: "Isometric", D: "Isokinetic" },
            correctAnswer: "C",
            rationale: "An isometric contraction occurs when a muscle is activated but no movement occurs, and the muscle does not change length. This happens when the force produced by the muscle is equal to the resistance.",
            source: "'Isometric • Muscle is activated but no movement' (Introduction to the Musculoskeletal System, Slide 23)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 5: Differentiate between different types of muscle contractions. Determine the role that a muscle or group of muscles serve during movement (agonist, antagonist, or synergist).",
            question: "During the downward phase of a bicep curl, a person is slowly lowering a dumbbell. The biceps brachii muscle is active to control the movement, but it is lengthening rather than shortening. What is the role of the biceps brachii during this specific action?",

            source: "'Eccentric • Muscle is activated but is elongated' (Introduction to the Musculoskeletal System, Slide 23)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 6: Identify the types of musculoskeletal levers and how they contribute to human motion.",
            question: "When a person performs a calf raise to stand on their toes, the ball of the foot acts as the fulcrum, the weight of the body is the load, and the calf muscles provide the effort. The load is located between the fulcrum and the effort. This arrangement describes which class of lever?",
            options: { A: "First-class lever", B: "Second-class lever", C: "Third-class lever", D: "Fourth-class lever" },
            correctAnswer: "B",
            rationale: "In a second-class lever, the load is positioned between the fulcrum and the effort. The example of a calf raise, with the fulcrum at the ball of the foot, the body's weight (load) acting through the ankle, and the calf muscles (effort) pulling on the heel, is a classic example.",
            source: "The schema for a second-class lever shows the load between the fulcrum and the effort, with the calf raise example depicted. (Introduction to the Musculoskeletal System, Slide 29)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 6: Identify the types of musculoskeletal levers and how they contribute to human motion.",
            question: "Most joint articulations in the human body, such as the elbow joint during a biceps curl, function as a specific class of lever where the effort is applied between the fulcrum and the load. This arrangement prioritizes speed and range of motion over force. Which class of lever is this?",
            options: { A: "First-class lever", B: "Second-class lever", C: "Third-class lever", D: "Mechanical advantage lever" },
            correctAnswer: "C",
            rationale: "In a third-class lever, the effort is applied between the fulcrum and the load. This is the most common type of lever in the human body and does not provide a mechanical advantage, meaning the effort force is greater than the load force.",
            source: "'Most joint articulations in the human body are class 3 levers.' (Introduction to the Musculoskeletal System, Handout, Page 8)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 7: Differentiate arteries from veins.",
            question: "During a dissection, a medical student observes a blood vessel with thick, hollow-looking walls. The vessel branches at a wide angle from a larger vessel. Based on these macroscopic features, what type of vessel is the student most likely observing?",
            options: { A: "Vein", B: "Artery", C: "Capillary", D: "Lymphatic vessel" },
            correctAnswer: "B",
            rationale: "Arteries are characterized by having thicker, more robust walls compared to veins, which often makes them appear hollow when cut. They also typically branch at wide or right angles. Veins have thinner, floppy walls and often contain valves.",
            source: "'Arteries... Thicker walls, look hollow... Branch at right or wide angles' (Introduction to the Musculoskeletal System, Slide 9)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 7: Differentiate arteries from veins.",
            question: "A surgeon is performing a procedure and notes a set of blood vessels that are running in pairs alongside a single, larger vessel. The paired vessels have thin walls, and upon closer inspection, one is found to contain valves. What type of vessel are these thin-walled structures?",
            options: { A: "Arteries", B: "Arterioles", C: "Veins", D: "Capillaries" },
            correctAnswer: "C",
            rationale: "Veins are characterized by thinner, less rigid walls compared to arteries. They often contain valves to prevent the backflow of blood, and it is common for them to run in pairs (venae comitantes) surrounding an artery.",
            source: "'Veins... Thinner walls (floppy)... Often contain valves... May run in pairs surrounding artery' (Introduction to the Musculoskeletal System, Slide 9)"
        },
        {

            correctAnswer: "B",
            rationale: "Lymph is defined as the extracellular fluid that has been collected from tissues, along with plasma proteins that have leaked from capillaries. The lymphatic system's function is to return this fluid to the venous system.",
            source: "'Lymph – extracellular fluid collected from tissues and leaked plasma proteins from capillaries (ex. lymphocytes)' (Introduction to the Musculoskeletal System, Slide 12)"
        },
        {
            learningObjective: "(Introduction to the Musculoskeletal System) LO 8: Describe the function of the lymphatic system.",

            correctAnswer: "C",
            rationale: "Lymph nodes are small masses of lymphatic tissue through which lymph is filtered. During an infection, they become active in filtering out pathogens and cellular debris, which can cause them to swell.",
            source: "'Lymph nodes – small masses of lymphatic tissue through which lymph is filtered' (Introduction to the Musculoskeletal System, Slide 12)"
        },
        // Overview of the Nervous System and Spinal Cord
        {
            learningObjective: "(Overview of the Nervous System and Spinal Cord) LO 1 (Overview Section): Discuss the components of the central nervous system (CNS) and peripheral nervous system (PNS).",

            options: { A: "Peripheral nervous system (PNS)", B: "Somatic nervous system", C: "Central nervous system (CNS)", D: "Autonomic nervous system" },
            correctAnswer: "C",
            rationale: "The central nervous system (CNS) is defined as being composed of the brain and spinal cord. Its function is to integrate and coordinate neural signals.",
            source: "'Central Nervous System (CNS): composed of neuronal and glial cells that lie entirely within the brain or spinal cord.' (Peripheral Nervous System and Spinal Cord Histology Handout, Page 1)"
        },
        {
            learningObjective: "(Overview of the Nervous System and Spinal Cord) LO 1 (Overview Section): Discuss the components of the central nervous system (CNS) and peripheral nervous system (PNS).",
            question: "A patient is diagnosed with a condition that affects the ganglia and the nerves that connect the limbs to the spinal cord. These structures are all considered part of which major division of the nervous system?",

            correctAnswer: "C",
            rationale: "The peripheral nervous system (PNS) consists of all neural structures outside of the CNS, which includes cranial nerves, spinal nerves, and ganglia (collections of nerve cell bodies outside the CNS).",
            source: "'Peripheral Nervous System (PNS): neuronal and glial cells that lie in part or in their entirety outside the brain and the spinal cord.' (Peripheral Nervous System and Spinal Cord Histology Handout, Page 1)"
        },
        {
            learningObjective: "(Overview of the Nervous System and Spinal Cord) LO 2 (Spinal Cord Section): Describe the longitudinal organization of the spinal cord, including its structural features and functional components.",
            question: "A patient has an injury that affects the spinal cord segments responsible for innervating the upper limbs. This area of the spinal cord is visibly thicker than the regions immediately above and below it. What is this region called?",

        },
        {

            question: "An MRI of an adult patient's spine shows that the tapering inferior end of the spinal cord terminates at the level of the L1 vertebra. What is the anatomical term for this terminal end of the spinal cord?",

            rationale: "The conus medullaris is the tapering, cone-shaped inferior end of the spinal cord, which in adults typically terminates at the level of the L1 or L2 vertebra.",
            source: "'Conus medullaris – tapering inferior end of spinal cord that terminates inferior to the lumbosacral enlargement' (Overview of the Nervous System and Spinal Cord Handout, Page 2)"
        },
        {
            learningObjective: "(Overview of the Nervous System and Spinal Cord) LO 3 (Spinal Cord Section): Describe a typical spinal nerve, including its functional components, formation, and branching pattern.",

        },

            question: "After exiting the intervertebral foramen, a spinal nerve divides into two main branches. One branch proceeds to supply the skin and deep muscles of the back. What is this branch called?",

            rationale: "Each spinal nerve divides into a posterior ramus and an anterior ramus. The posterior ramus is responsible for innervating the skin and deep (intrinsic) muscles of the back.",
            source: "'Posterior ramus – supplies skin & deep muscles of the back' (Overview of the Nervous System and Spinal Cord Handout, Page 3)"
        },
        {
            learningObjective: "(Overview of the Nervous System and Spinal Cord) LO 4 (Spinal Cord Section): Compare the relationship of the spinal cord to spinal nerves and the position of both within the vertebral column. Discuss how spinal nerves are impacted by disc herniation.",
            question: "A 45-year-old man presents with severe lower back pain radiating down his left leg. An MRI reveals a posterolateral disc herniation between the L4 and L5 vertebrae. Which spinal nerve is most likely being compressed?",

    const quizContainer = document.getElementById('quiz-container');
    const themeToggleButton = document.getElementById('theme-toggle-button');
    const bodyElement = document.body;

    function applyTheme(theme) {
        if (theme === 'light') {
            bodyElement.classList.add('light-theme');
            themeToggleButton.textContent = 'Switch to Dark Mode';
        } else {
            bodyElement.classList.remove('light-theme');
            themeToggleButton.textContent = 'Switch to Light Mode';
        }
        localStorage.setItem('quizTheme', theme);
    }

    function loadQuiz() {
        quizData.forEach((qData, index) => {
            const questionBlock = document.createElement('div');
            questionBlock.classList.add('question-block');
            questionBlock.id = `q${index}`;

            const loText = document.createElement('div');
            loText.classList.add('learning-objective');
            loText.textContent = qData.learningObjective;
            questionBlock.appendChild(loText);

            const questionText = document.createElement('p');
            questionText.classList.add('question-text');
            questionText.innerHTML = `${index + 1}. ${qData.question}`;
            questionBlock.appendChild(questionText);

            const optionsDiv = document.createElement('div');
            optionsDiv.classList.add('options');

            for (const optionKey in qData.options) {
                const optionId = `q${index}_${optionKey}`;
                const label = document.createElement('label');
                label.htmlFor = optionId;
                const radioInput = document.createElement('input');
                radioInput.type = 'radio';
                radioInput.name = `q${index}`;
                radioInput.value = optionKey;
                radioInput.id = optionId;
                const labelText = document.createElement('span');
                labelText.textContent = ` ${optionKey}. ${qData.options[optionKey]}`;
                label.appendChild(radioInput);
                label.appendChild(labelText);
                optionsDiv.appendChild(label);
            }
            questionBlock.appendChild(optionsDiv);

            const buttonContainer = document.createElement('div');
            buttonContainer.classList.add('button-container');

            const checkButton = document.createElement('button');
            checkButton.textContent = 'Check Answer';
            checkButton.classList.add('check-button');
            checkButton.onclick = () => checkAnswer(index);
            buttonContainer.appendChild(checkButton);
            
            questionBlock.appendChild(buttonContainer);

            const feedbackDiv = document.createElement('div');
            feedbackDiv.classList.add('feedback');
            questionBlock.appendChild(feedbackDiv);

            quizContainer.appendChild(questionBlock);
        });
    }

    function checkAnswer(questionIndex) {
        const questionBlockElement = document.getElementById(`q${questionIndex}`);
        const selectedRadioButton = questionBlockElement.querySelector('input[type="radio"]:checked');

        if (!selectedRadioButton) {
            alert("Please select an answer first.");
            return;
        }

        const selectedOptionKey = selectedRadioButton.value;
        const qData = quizData[questionIndex];
        const feedbackDiv = questionBlockElement.querySelector('.feedback');
        const correct = selectedOptionKey === qData.correctAnswer;

        let feedbackHTML = '';

        if (correct) {
            feedbackHTML = `<span class="feedback-status">Correct!</span>`;
            feedbackDiv.className = 'feedback correct';
        } else {
             feedbackHTML = `<span class="feedback-status">Incorrect. The correct answer is ${qData.correctAnswer}.</span>`;
            feedbackDiv.className = 'feedback incorrect';
        }

        feedbackHTML += `<div class="feedback-rationale"><strong>Rationale:</strong> ${qData.rationale}</div>`;
        feedbackHTML += `<div class="feedback-source"><strong>Source:</strong> ${qData.source}</div>`;
        feedbackDiv.innerHTML = feedbackHTML;
    }

    themeToggleButton.addEventListener('click', () => {
        if (bodyElement.classList.contains('light-theme')) {
            applyTheme('dark');
        } else {
            applyTheme('light');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('quizTheme') || 'dark';
        applyTheme(savedTheme);
        loadQuiz();
    });

</script>
